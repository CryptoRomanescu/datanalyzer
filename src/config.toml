# == Helius mainnet ==
rpc_url = "https://mainnet.helius-rpc.com/?api-key=YOUR_API_KEY_HERE"
rpc_ws_url = "wss://mainnet.helius-rpc.com/?api-key=YOUR_API_KEY_HERE"

# Alternatively, use public endpoints (may have rate limits):
# rpc_url = "https://api.mainnet-beta.solana.com"
# rpc_ws_url = "wss://api.mainnet-beta.solana.com"

# Wyjście CSV i interwał snapshotów
output_dir = "./snapshots"
snapshot_interval_ms = 1000

# == CSV ==
[csv]
append = true
max_file_size = 500000000   # 500 MB (0 = wyłącz rotację po rozmiarze)
max_file_age = 0            # 0 = wyłącz rotację po wieku
batch_size = 500
batch_time_ms = 3000

# == Oracle ==
[oracle]
# Stable mints: LISTA adresów MINT (Pubkey) stablecoinów -> traktowane jako 1.0 USD
stable_mints = [
  "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC (classic SPL)
  "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB", # USDT
]

# Cena quote->USD dla niestabilnych quote (np. SOL) z Jupiter; cache 60s
jupiter_url = "https://price.jup.ag/v4"
ttl_secs = 60

# == Pule ==
# Raydium AMM v4 program: 675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8
# Uwaga:
# - dex_type: "raydium" lub "pumpfun"
# - pool_address: adres konta puli (Raydium: AMM id)
# - token_mint: MINT tokenu bazowego (BASE) w puli

# Raydium: SOL/USDC (BASE = SOL)
# This is a verified Raydium AMM v4 pool (752 bytes)
[[pools]]
pool_address = "58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2"
dex_type = "raydium"
token_mint = "So11111111111111111111111111111111111111112"  # BASE = SOL

